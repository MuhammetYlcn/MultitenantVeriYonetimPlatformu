# Panelin web sunucusu. İki iş yapıyor: derlenmiş Flutter çıktısını sunmak ve
# /api ile /hubs isteklerini API konteynerine iletmek.
#
# NEDEN VEKİL (proxy) — panel doğrudan http://localhost:5000'e de gidebilirdi:
#  1. Tarayıcı gözünde panel ile API AYNI ADRESTE olur. Çapraz-origin isteği hiç
#     doğmadığı için CORS listesinin doğru ayarlanmış olmasına bağımlılık kalkar;
#     kurulumu yapan kişinin unutabileceği bir ayar eksilir. (CORS ayarı duruyor ve
#     hâlâ dar; teslim kurulumunda sadece devreye girmiyor.)
#  2. Dışarıya tek kapı açılır. Panel hangi adresten görünüyorsa API de oradan
#     görünür — makine adı/port/alan adı değişince ayrı ayrı güncellenecek iki adres
#     yerine bir tane olur.
#
# `map` ve `server` doğrudan burada duruyor: nginx temel imajı bu dizini http bloğunun
# içinden dahil ediyor, yani buradaki yönergeler http bağlamında geçerli.

# WebSocket el sıkışması, isteği olduğu gibi ileten bir vekilde kendiliğinden çalışmaz:
# `Connection` başlığı atlamalı (hop-by-hop) bir başlıktır ve vekil onu düşürür. Bu eşleme,
# istek yükseltme istiyorsa (`Upgrade: websocket`) `Connection: upgrade` yazar, istemiyorsa
# `close` yazıp bağlantıyı normal biçimde kapatır. Olmazsa SignalR WebSocket'e geçemez;
# görünen belirti "canlı bildirimler gelmiyor" olur.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sunucudaki yükleme sınırı 15 MB (DocumentsController). nginx'in varsayılanı 1 MB'dır,
    # yani ayarlanmasaydı 1 MB üstü her dosya API'ye HİÇ ULAŞMADAN, nginx'in kendi
    # İngilizce 413 sayfasıyla reddedilirdi. Sınır bilerek sunucununkinden YÜKSEK (20 MB):
    # reddi veren taraf uygulama olsun ki kullanıcı kendi dilinde, sınırı söyleyen mesajı
    # görsün. nginx yalnız saçma büyüklükteki isteklere karşı bir emniyet supabı.
    client_max_body_size 20m;

    # Docker'ın gömülü DNS sunucusu. Aşağıda proxy_pass adresi DEĞİŞKENE konuyor; bunun
    # sebebi nginx'in sabit yazılmış bir sunucu adını YALNIZ AÇILIŞTA çözmesi. Sabit
    # yazılsaydı iki sorun çıkardı: (1) API konteyneri panelden sonra ayağa kalkarsa nginx
    # "host not found in upstream" diyip hiç açılmaz, (2) API yeniden başlayıp IP'si
    # değişirse panel eski IP'ye istek atmayı sürdürür. Değişken kullanıldığında adres her
    # istekte yeniden çözülüyor.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Statik dosyalar -----------------------------------------------------
    #
    # Bu üç dosya ÖNBELLEĞE ALINMAMALI. config.js kurulumun API adresini taşıyor: tarayıcıda
    # önbelleğe girerse adres değiştikten sonra da eski adres kullanılır ve panel "sebepsiz"
    # çalışmaz hâle gelir. index.html ve servis işçisi ise yeni sürümün yüklenmesinin önünü
    # açan dosyalar; onlar önbellekte kalırsa kullanıcı güncellenmiş paneli hiç göremez.
    # (Geri kalan dosya adlarında sürüm damgası var, onlar önbelleğe girebilir.)
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store" always;
    }

    # --- API'ye vekillik -----------------------------------------------------
    #
    # ^~ öneki: bu yol eşleşirse nginx düzenli ifadeli konumlara hiç bakmasın.
    location ^~ /api/ {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Varsayılan 60 saniye BU PROJE İÇİN KISA: doğal dilde sorgu modele gidiyor
        # (Ollama zaman aşımı 120 sn) ve belge okuma görsel modele gidiyor (300 sn).
        # Ayarlanmasaydı ağır bir belge her seferinde nginx tarafından 504 ile kesilir,
        # kullanıcı da sunucunun hâlâ çalıştığını bilmezdi.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Canlı bildirim kanalı ----------------------------------------------
    location ^~ /hubs/ {
        set $hub_upstream http://api:5000;
        proxy_pass $hub_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Arabelleğe alma kapalı: kanalın işi mesajı ANINDA iletmek. Açık kalsaydı nginx
        # küçük mesajları biriktirip toplu göndermeye çalışır, bildirim gecikirdi.
        proxy_buffering off;

        # Bağlantı boşta dursa bile kapanmamalı — kullanıcı sayfayı açık bırakıp
        # işin bitmesini bekliyor olabilir.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Uygulamanın kendisi -------------------------------------------------
    #
    # Tek sayfalık uygulama: dosya olarak var olmayan her yol index.html'e düşürülüyor,
    # yoksa panelin bir alt adresinde sayfa yenilendiğinde nginx 404 verirdi.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Referrer-Policy        "no-referrer" always;
    }
}
